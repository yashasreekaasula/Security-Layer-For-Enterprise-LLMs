services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: company_copilot
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d company_copilot"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://copilot:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/company_copilot
      JWT_SECRET: ${JWT_SECRET:-replace-this-development-secret-before-deployment}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
